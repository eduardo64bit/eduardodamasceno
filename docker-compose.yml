services:
  web:
    build: .
    ports:
      # Padrão 9090 — evita conflito com ilovemalu (9080) e luizdaniel (8080).
      - "${EDUARDODAMASCENO_HTTP_PORT:-9090}:3000"
    environment:
      - SITE_DB_PATH=/app/data/site.db
      - EDITOR_PASSWORD=${EDITOR_PASSWORD:-admin}
      - EDITOR_SECRET=${EDITOR_SECRET:-editor-secret}
      - PORTFOLIO_PASSWORD=${PORTFOLIO_PASSWORD:-portfolio}
      - PORTFOLIO_SECRET=${PORTFOLIO_SECRET:-portfolio-secret}
      - PORTFOLIO_SHOW_HOME_PROJECTS=${PORTFOLIO_SHOW_HOME_PROJECTS:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - SITE_PUBLIC_ORIGIN=${SITE_PUBLIC_ORIGIN:-https://eduardodamasceno.com.br}
      - WP_SITE_URL=${WP_SITE_URL:-}
      - WP_SITE_PASSWORD=${WP_SITE_PASSWORD:-}
      - WP_POST_PASSWORD=${WP_POST_PASSWORD:-}
    volumes:
      - site_data:/app/data
    restart: unless-stopped

volumes:
  site_data:
